name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_32
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Show Zig version
        run: zig version

      - name: Check formatting
        run: zig fmt --check build.zig build docs/root.zig src tests

      - name: Run unit tests
        run: zig build tests

      - name: Build root task artifact
        working-directory: OS-Root-Task
        run: zig build -Darch=${{ matrix.arch }}

      - name: Build kernel with external root task artifact
        run: |
          zig build -Darch=${{ matrix.arch }} \
            -Droot-task=${{ github.workspace }}/OS-Root-Task/zig-out/${{ matrix.arch }}/bin/root_process.elf